services:
  db:
    image: pgvector/pgvector:pg16
    container_name: self-server-db
    restart: unless_stopped
    env_file:
      ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # local access
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # run sql files in db/init/ once on first container start
      - ../db/init:/docker-entrypoint-initdb.d:ro # set read only

volumes:
  pgdata:
