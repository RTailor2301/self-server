name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  POSTGRES_USER: musicnet
  POSTGRES_PASSWORD: musicnet
  POSTGRES_DB: musicnet
  DATABASE_URL: postgresql://musicnet:musicnet@127.0.0.1:5432/musicnet

jobs:
  db-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure host environment variables
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=musicnet
          POSTGRES_PASSWORD=musicnet
          POSTGRES_DB=musicnet
          DATABASE_URL: postgresql://musicnet:musicnet@127.0.0.1:5432/music
          EOF
      
      - name: Start Postgres
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --wait

      - name: Check extensions and schema
        run: |
          docker exec self-server-db psql -U musicnet -d musicnet -c \
            "SELECT extname FROM pg_extension WHERE extname IN ('vector', 'pgcrypto') ORDER BY extname;"
          docker exec self-server-db psql -U musicnet -d musicnet -c "\dt"

      