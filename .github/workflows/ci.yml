# MusicNet CI Pipeline
# Spin up temporary containerized Postgres/Docker instance
# Run main checks (health, env var loading, extensions, schema, dependencies)
# Run forced stop

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  POSTGRES_USER: musicnet
  POSTGRES_PASSWORD: musicnet
  POSTGRES_DB: musicnet
  DATABASE_URL: postgresql://musicnet:musicnet@127.0.0.1:5432/musicnet

jobs:
  db-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure host environment variables
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=musicnet
          POSTGRES_PASSWORD=musicnet
          POSTGRES_DB=musicnet
          DATABASE_URL: postgresql://musicnet:musicnet@127.0.0.1:5432/musicnet
          EOF
      
      - name: Start Postgres
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --wait

      - name: Check extensions and schema
        run: |
          docker exec self-server-db psql -U musicnet -d musicnet -c \
            "SELECT extname FROM pg_extension WHERE extname IN ('vector', 'pgcrypto') ORDER BY extname;"
          docker exec self-server-db psql -U musicnet -d musicnet -c "\dt"

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run db smoke tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest ../tests/test_database.py -v

      - name: Stop Postgres
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml down -v
